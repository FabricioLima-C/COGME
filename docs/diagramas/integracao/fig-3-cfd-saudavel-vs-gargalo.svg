<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>
  <text x="700" y="40" text-anchor="middle" font-size="25" font-weight="bold" fill="#111111">Cumulative Flow Diagram (CFD) — Padrão Saudável vs. Gargalo</text>
  
  <!-- Painel A: CFD Saudável -->
  <g transform="translate(50, 80)">
    <text x="300" y="20" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F3A5F">(a) CFD Saudável — Fluxo Estável</text>
    
    <!-- Eixos -->
    <line x1="50" y1="40" x2="50" y2="480" stroke="#333333" stroke-width="2"/>
    <line x1="50" y1="480" x2="600" y2="480" stroke="#333333" stroke-width="2"/>
    <text x="20" y="260" text-anchor="middle" font-size="14" fill="#555555" transform="rotate(-90, 20, 260)">Cards Acumulados</text>
    <text x="325" y="510" text-anchor="middle" font-size="14" fill="#555555">Tempo (semanas)</text>
    
    <!-- Bandas paralelas e estáveis -->
    <!-- Done (verde) -->
    <path d="M 50 480 L 600 480 L 600 420 L 50 420 Z" fill="#2E7D32" opacity="0.8"/>
    <text x="580" y="455" text-anchor="end" font-size="12" font-weight="bold" fill="#FFFFFF">Done</text>
    
    <!-- Code Review (azul claro) -->
    <path d="M 50 420 L 600 420 L 600 370 L 50 370 Z" fill="#4A90E2" opacity="0.8"/>
    <text x="580" y="400" text-anchor="end" font-size="12" font-weight="bold" fill="#FFFFFF">Code Review</text>
    
    <!-- In Progress (azul médio) -->
    <path d="M 50 370 L 600 370 L 600 310 L 50 310 Z" fill="#1F3A5F" opacity="0.8"/>
    <text x="580" y="345" text-anchor="end" font-size="11" font-weight="bold" fill="#FFFFFF">In Progress</text>
    
    <!-- Ready (laranja) -->
    <path d="M 50 310 L 600 310 L 600 260 L 50 260 Z" fill="#E67E22" opacity="0.8"/>
    <text x="580" y="290" text-anchor="end" font-size="11" font-weight="bold" fill="#FFFFFF">Ready</text>
    
    <!-- Backlog (cinza) -->
    <path d="M 50 260 L 600 260 L 600 200 L 50 200 Z" fill="#7F8C8D" opacity="0.8"/>
    <text x="580" y="235" text-anchor="end" font-size="12" font-weight="bold" fill="#FFFFFF">Backlog</text>
    
    <!-- Anotação -->
    <text x="325" y="540" text-anchor="middle" font-size="15" fill="#2E7D32" font-weight="bold">Bandas paralelas e de largura constante</text>
    <text x="325" y="560" text-anchor="middle" font-size="12" fill="#555555">Fluxo estável — WIP sob controle</text>
  </g>
  
  <!-- Painel B: CFD com Gargalo -->
  <g transform="translate(750, 80)">
    <text x="300" y="0" text-anchor="middle" font-size="18" font-weight="bold" fill="#C0392B">(b) CFD com Gargalo — Code Review</text>
    
    <!-- Eixos -->
    <line x1="50" y1="40" x2="50" y2="480" stroke="#333333" stroke-width="2"/>
    <line x1="50" y1="480" x2="600" y2="480" stroke="#333333" stroke-width="2"/>
    <text x="20" y="260" text-anchor="middle" font-size="12" fill="#555555" transform="rotate(-90, 20, 260)">Cards Acumulados</text>
    <text x="325" y="510" text-anchor="middle" font-size="14" fill="#555555">Tempo (semanas)</text>
    
    <!-- Bandas com gargalo em Code Review -->
    <!-- Done (verde) - estreita -->
    <path d="M 50 480 L 600 480 L 600 450 L 50 450 Z" fill="#2E7D32" opacity="0.8"/>
    <text x="580" y="470" text-anchor="end" font-size="12" font-weight="bold" fill="#FFFFFF">Done</text>
    
    <!-- Code Review (azul claro) - ALARGANDO (gargalo) -->
    <path d="M 50 450 L 200 450 L 350 420 L 500 380 L 600 350 L 600 250 L 500 280 L 350 320 L 200 350 L 50 350 Z" fill="#4A90E2" opacity="0.8"/>
    <text x="580" y="310" text-anchor="end" font-size="12" font-weight="bold" fill="#FFFFFF">Code Review</text>
    
    <!-- Seta indicando alargamento -->
    <path d="M 400 340 L 450 320" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="450" y="315" font-size="11" fill="#C0392B" font-weight="bold">Gargalo</text>
    
    <!-- In Progress (azul médio) - estável -->
    <path d="M 50 350 L 200 350 L 350 320 L 500 280 L 600 250 L 600 200 L 500 230 L 350 270 L 200 300 L 50 300 Z" fill="#1F3A5F" opacity="0.8"/>
    <text x="580" y="245" text-anchor="end" font-size="12" font-weight="bold" fill="#FFFFFF">In Progress</text>
    
    <!-- Ready (laranja) - estável -->
    <path d="M 50 300 L 200 300 L 350 270 L 500 230 L 600 200 L 600 160 L 500 190 L 350 230 L 200 260 L 50 260 Z" fill="#E67E22" opacity="0.8"/>
    <text x="580" y="195" text-anchor="end" font-size="12" font-weight="bold" fill="#FFFFFF">Ready</text>
    
    <!-- Backlog (cinza) - estável -->
    <path d="M 50 260 L 200 260 L 350 230 L 500 190 L 600 160 L 600 120 L 500 150 L 350 190 L 200 220 L 50 220 Z" fill="#7F8C8D" opacity="0.8"/>
    <text x="580" y="150" text-anchor="end" font-size="12" font-weight="bold" fill="#FFFFFF">Backlog</text>
    
    <!-- Anotação -->
    <text x="325" y="540" text-anchor="middle" font-size="15" fill="#C0392B" font-weight="bold">Banda Code Review alargando progressivamente</text>
    <text x="325" y="560" text-anchor="middle" font-size="12" fill="#555555">Gargalo detectado — ação corretiva necessária</text>
  </g>
  
  <!-- Regra de Ação Corretiva (comum aos dois painéis) -->
  <rect x="200" y="710" width="1000" height="80" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="700" y="745" text-anchor="middle" font-size="15" font-weight="bold" fill="#E65100">Regra de Ação Corretiva (Integração §1.6.1)</text>
  <text x="700" y="765" text-anchor="middle" font-size="14" fill="#333333">Se uma banda ultrapassar 2× a largura média das demais por 2 semanas consecutivas → Retrospectiva extraordinária (ADR-002)</text>
  
  <!-- Definição de marker -->
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#C0392B"/>
    </marker>
  </defs>
</svg>