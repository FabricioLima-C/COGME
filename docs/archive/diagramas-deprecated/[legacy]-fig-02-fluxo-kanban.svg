<?xml version="1.0" encoding="UTF-8"?>
<!--
  FIG-2 — Fluxo Kanban Oficial com WIP Limits (v3 — Layout Repaginado)
  Projeto COGME | Plano de Integração §1.3.1 | Materializa ADR-002 + ADR-004
  Fonte e entregável: este arquivo .svg (padrão aberto W3C, zero dependências).
  
  MUDANÇAS v2 → v3:
  - ViewBox expandido de 1200x700 para 1600x750 (proporção A4 paisagem)
  - Gaps de 40px entre colunas e gates (antes ~10px) — setas agora evidentes
  - Gates alargados de 60px para 80px (labels internos respiram)
  - Setas com 36px de comprimento atravessando os gaps (stroke 2.5px)
  - Hierarquia vertical de textos com 20-25px entre linhas
  - Loop de retrabalho com curva mais profunda e afastada
  - Notas WIP e Métricas reposicionadas sem colidir com colunas
  
  Colunas (ADR-002): Backlog → Ready (DoR) → In Progress → Code Review → Done (DoD)
  Gates (tracejados vermelhos): DoR, Pull, Tasklist (ADR-004), DoD
  WIP limit: 3 cards/pessoa em In Progress (máx. 9 no fluxo; TAP §10 R3)
  Loop de retrabalho: Code Review → In Progress (revisão rejeitada)
  Métricas: Cycle Time (In Progress → Done), Throughput, unidade = card pai (ADR-004)
  Paleta: oficial do repositório (§9.1 da base de conhecimento operacional).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750"
     role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Figura 2 — Fluxo Kanban oficial do projeto COGME com gates e WIP limits</title>
  <desc id="d">Cinco colunas do fluxo Kanban com quatro gates de qualidade entre elas, limite de WIP sobre In Progress, loop de retrabalho e notas de métricas.</desc>

  <defs>
    <marker id="arrG" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#616161"/></marker>
    <marker id="arrR" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#B60205"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="750" fill="#FFFFFF"/>

  <!-- Título -->
  <text x="800" y="45" font-size="18" font-weight="bold" text-anchor="middle" fill="#212121">
    Fluxo Kanban Oficial — COGME (ADR-002 + ADR-004)
  </text>

  <!-- ============ COLUNA 1: BACKLOG ============ -->
  <g id="col-backlog">
    <rect x="30" y="150" width="180" height="400" rx="8" fill="#F5F5F5" stroke="#616161" stroke-width="2"/>
    <text x="120" y="195" font-size="17" font-weight="bold" text-anchor="middle" fill="#212121">Backlog</text>
    <text x="120" y="230" font-size="13" text-anchor="middle" fill="#424242">Cards não planejados</text>
    <text x="120" y="255" font-size="13" text-anchor="middle" fill="#424242">DoR pendente</text>
  </g>

  <!-- ============ GATE 1: DoR ============ -->
  <g id="gate-1">
    <rect x="250" y="250" width="80" height="200" rx="6"
          fill="#FFFFFF" stroke="#B60205" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="290" y="285" font-size="11" font-weight="bold" text-anchor="middle" fill="#B60205">Gate 1</text>
    <text x="290" y="310" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">DoR</text>
    <text x="290" y="335" font-size="10" text-anchor="middle" fill="#424242">Escopo §2.6</text>
    <text x="290" y="360" font-size="9" text-anchor="middle" fill="#616161">título · aceite</text>
    <text x="290" y="378" font-size="9" text-anchor="middle" fill="#616161">rastreabilidade</text>
    <text x="290" y="396" font-size="9" text-anchor="middle" fill="#616161">≤ 8h · resp.</text>
  </g>

  <!-- ============ COLUNA 2: READY (DoR) ============ -->
  <g id="col-ready">
    <rect x="370" y="150" width="180" height="400" rx="8" fill="#D4C5F9" stroke="#9575CD" stroke-width="2"/>
    <text x="460" y="195" font-size="17" font-weight="bold" text-anchor="middle" fill="#212121">Ready (DoR)</text>
    <text x="460" y="230" font-size="13" text-anchor="middle" fill="#424242">Cards refinados</text>
    <text x="460" y="255" font-size="13" text-anchor="middle" fill="#424242">aguardando capacidade</text>
  </g>

  <!-- ============ GATE 2: Pull ============ -->
  <g id="gate-2">
    <rect x="590" y="250" width="80" height="200" rx="6"
          fill="#FFFFFF" stroke="#B60205" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="630" y="285" font-size="11" font-weight="bold" text-anchor="middle" fill="#B60205">Gate 2</text>
    <text x="630" y="310" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">Pull</text>
    <text x="630" y="335" font-size="10" text-anchor="middle" fill="#424242">capacidade</text>
    <text x="630" y="355" font-size="10" text-anchor="middle" fill="#424242">disponível</text>
    <text x="630" y="380" font-size="9" text-anchor="middle" fill="#616161">WIP limit</text>
    <text x="630" y="398" font-size="9" text-anchor="middle" fill="#616161">respeitado</text>
  </g>

  <!-- ============ COLUNA 3: IN PROGRESS ============ -->
  <g id="col-inprogress">
    <rect x="710" y="150" width="180" height="400" rx="8" fill="#1D76DB" stroke="#0B3D6E" stroke-width="2"/>
    <text x="800" y="195" font-size="17" font-weight="bold" text-anchor="middle" fill="#FFFFFF">In Progress</text>
    <text x="800" y="230" font-size="13" text-anchor="middle" fill="#FFFFFF">Execução ativa</text>
    <text x="800" y="255" font-size="13" text-anchor="middle" fill="#FFFFFF">tasklist se ≥ 6h</text>
    <text x="800" y="280" font-size="12" font-style="italic" text-anchor="middle" fill="#FFFFFF">(ADR-004)</text>
  </g>

  <!-- ============ GATE 3: Tasklist ============ -->
  <g id="gate-3">
    <rect x="930" y="250" width="80" height="200" rx="6"
          fill="#FFFFFF" stroke="#B60205" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="970" y="285" font-size="11" font-weight="bold" text-anchor="middle" fill="#B60205">Gate 3</text>
    <text x="970" y="310" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">Tasklist</text>
    <text x="970" y="335" font-size="10" text-anchor="middle" fill="#424242">100% itens</text>
    <text x="970" y="355" font-size="9" text-anchor="middle" fill="#616161">(ADR-004)</text>
    <text x="970" y="380" font-size="10" text-anchor="middle" fill="#424242">+ revisor</text>
    <text x="970" y="398" font-size="10" text-anchor="middle" fill="#424242">atribuído</text>
  </g>

  <!-- ============ COLUNA 4: CODE REVIEW ============ -->
  <g id="col-codereview">
    <rect x="1050" y="150" width="180" height="400" rx="8" fill="#FBCA04" stroke="#8A6D00" stroke-width="2"/>
    <text x="1140" y="195" font-size="17" font-weight="bold" text-anchor="middle" fill="#212121">Code Review</text>
    <text x="1140" y="230" font-size="13" text-anchor="middle" fill="#212121">Revisão por pares</text>
    <text x="1140" y="255" font-size="13" text-anchor="middle" fill="#212121">obrigatória</text>
  </g>

  <!-- ============ GATE 4: DoD ============ -->
  <g id="gate-4">
    <rect x="1270" y="250" width="80" height="200" rx="6"
          fill="#FFFFFF" stroke="#B60205" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="1310" y="285" font-size="11" font-weight="bold" text-anchor="middle" fill="#B60205">Gate 4</text>
    <text x="1310" y="310" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">DoD</text>
    <text x="1310" y="335" font-size="10" text-anchor="middle" fill="#424242">Escopo §2.6</text>
    <text x="1310" y="358" font-size="9" text-anchor="middle" fill="#616161">testes ≥ 80%</text>
    <text x="1310" y="376" font-size="9" text-anchor="middle" fill="#616161">CI verde</text>
    <text x="1310" y="394" font-size="9" text-anchor="middle" fill="#616161">aprovação par</text>
    <text x="1310" y="412" font-size="9" text-anchor="middle" fill="#616161">co-autoria SDD</text>
  </g>

  <!-- ============ COLUNA 5: DONE (DoD) ============ -->
  <g id="col-done">
    <rect x="1390" y="150" width="180" height="400" rx="8" fill="#0E8A16" stroke="#075B0E" stroke-width="2"/>
    <text x="1480" y="195" font-size="17" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Done (DoD)</text>
    <text x="1480" y="230" font-size="13" text-anchor="middle" fill="#FFFFFF">Incremento entregue</text>
    <text x="1480" y="255" font-size="13" text-anchor="middle" fill="#FFFFFF">commit mergeado</text>
  </g>

  <!-- ============ SETAS DO FLUXO PRINCIPAL (evidentes, 36px cada) ============ -->
  <!-- Backlog (210) → Gate 1 (250) -->
  <line x1="212" y1="350" x2="248" y2="350" stroke="#616161" stroke-width="2.5" marker-end="url(#arrG)"/>
  <!-- Gate 1 (330) → Ready (370) -->
  <line x1="332" y1="350" x2="368" y2="350" stroke="#616161" stroke-width="2.5" marker-end="url(#arrG)"/>
  <!-- Ready (550) → Gate 2 (590) -->
  <line x1="552" y1="350" x2="588" y2="350" stroke="#616161" stroke-width="2.5" marker-end="url(#arrG)"/>
  <!-- Gate 2 (670) → In Progress (710) -->
  <line x1="672" y1="350" x2="708" y2="350" stroke="#616161" stroke-width="2.5" marker-end="url(#arrG)"/>
  <!-- In Progress (890) → Gate 3 (930) -->
  <line x1="892" y1="350" x2="928" y2="350" stroke="#616161" stroke-width="2.5" marker-end="url(#arrG)"/>
  <!-- Gate 3 (1010) → Code Review (1050) -->
  <line x1="1012" y1="350" x2="1048" y2="350" stroke="#616161" stroke-width="2.5" marker-end="url(#arrG)"/>
  <!-- Code Review (1230) → Gate 4 (1270) -->
  <line x1="1232" y1="350" x2="1268" y2="350" stroke="#616161" stroke-width="2.5" marker-end="url(#arrG)"/>
  <!-- Gate 4 (1350) → Done (1390) -->
  <line x1="1352" y1="350" x2="1388" y2="350" stroke="#616161" stroke-width="2.5" marker-end="url(#arrG)"/>

  <!-- ============ LOOP DE RETRABALHO ============ -->
  <path d="M 1140 550 Q 970 680, 800 550"
        fill="none" stroke="#B60205" stroke-width="2" stroke-dasharray="6,3"
        marker-end="url(#arrR)"/>
  <text x="970" y="700" font-size="12" font-style="italic" text-anchor="middle" fill="#B60205">
    alterações solicitadas → retrabalho
  </text>

  <!-- ============ NOTA: WIP LIMIT ============ -->
  <g id="nota-wip">
    <rect x="700" y="55" width="200" height="75" rx="6" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1.5"/>
    <text x="710" y="78" font-size="13" font-weight="bold" fill="#B60205">⚠ WIP LIMIT</text>
    <text x="710" y="98" font-size="12" fill="#212121">≤ 3 cards/pessoa em In Progress</text>
    <text x="710" y="116" font-size="11" fill="#424242">máx. 9 no fluxo (3 membros)</text>
    <line x1="800" y1="130" x2="800" y2="148" stroke="#D4A72C" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- ============ NOTA: MÉTRICAS (ADR-003) ============ -->
  <g id="nota-metricas">
    <rect x="1380" y="580" width="200" height="90" rx="6" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1.5"/>
    <text x="1390" y="602" font-size="13" font-weight="bold" fill="#212121">📊 MÉTRICAS (ADR-003)</text>
    <text x="1390" y="622" font-size="11" fill="#424242">Cycle Time = In Progress → Done</text>
    <text x="1390" y="642" font-size="11" fill="#424242">Throughput = cards concluídos/sem</text>
    <text x="1390" y="662" font-size="11" fill="#424242">unidade = card pai (ADR-004)</text>
    <line x1="1480" y1="552" x2="1480" y2="578" stroke="#D4A72C" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- ============ RODAPÉ ============ -->
  <text x="800" y="735" font-size="11" font-style="italic" fill="#616161" text-anchor="middle">
    Gate não atendido → card permanece na coluna anterior. Unidade atômica de métrica = card pai (subissues rejeitadas, ADR-004).
  </text>
</svg>