<?xml version="1.0" encoding="UTF-8"?>
<!--
  FIG-2 — Fluxo Kanban Oficial com WIP Limits
  Projeto COGME | Plano de Integração §1.3.1 | Diagrama operacional central
  Fonte e entregável: este arquivo .svg (padrão aberto W3C, zero dependências).
  Materializa: ADR-002 (fluxo contínuo) + ADR-004 (tasklists) + ADR-003 (métricas)
  Colunas (ADR-002): Backlog → Ready (DoR) → In Progress → Code Review → Done (DoD)
  Gates:
    G1 (DoR)     — entrada de Ready
    G2 (Pull)    — entrada de In Progress (capacidade / WIP limit)
    G3 (Tasklist)— entrada de Code Review (100% itens ADR-004 + revisor)
    G4 (DoD)     — entrada de Done
  Regra geral: gate não atendido → card permanece na coluna anterior.
  Loop pontilhado vermelho: revisão rejeitada → retrabalho (Code Review → In Progress).
  Paleta: oficial do repositório (§9.1 da base de conhecimento operacional).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="800" viewBox="0 0 1750 800"
     role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Figura 2 — Fluxo Kanban oficial do projeto COGME com gates de qualidade e WIP limits</title>
  <desc id="d">Cinco colunas de fluxo contínuo intercaladas por quatro gates de qualidade (DoR, Pull, Tasklist, DoD), com limite de trabalho em progresso destacado sobre a coluna In Progress e loop de retrabalho a partir de Code Review.</desc>

  <defs>
    <marker id="arrFlow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#333333"/></marker>
    <marker id="arrReturn" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#D73A4A"/></marker>
  </defs>

  <rect x="0" y="0" width="1750" height="800" fill="#FFFFFF"/>

  <!-- Título geral -->
  <text x="875" y="34" font-size="17" font-weight="bold" text-anchor="middle" fill="#212121">
    Fluxo Kanban Oficial — COGME (ADR-002 · fluxo contínuo · sem sprints)
  </text>

  <!-- ============ NOTA: WIP LIMIT (acima de In Progress) ============ -->
  <g id="nota-wip">
    <rect x="729" y="105" width="260" height="98" rx="6" ry="6"
          fill="#FFF8C5" stroke="#D4A72C" stroke-width="1.5"/>
    <text x="859" y="128" font-size="13" font-weight="bold" text-anchor="middle" fill="#8A6D00">
      ⚠ WIP LIMIT
    </text>
    <text x="859" y="148" font-size="12" text-anchor="middle" fill="#424242">
      ≤ 3 cards/pessoa em In Progress
    </text>
    <text x="859" y="166" font-size="12" text-anchor="middle" fill="#424242">
      máx. 9 no fluxo (3 membros)
    </text>
    <text x="859" y="184" font-size="11" text-anchor="middle" fill="#616161">
      prevenção de burnout — TAP §10 R3
    </text>
    <!-- conector pontilhado até o topo da coluna In Progress -->
    <line x1="859" y1="203" x2="859" y2="308" stroke="#D4A72C" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- ============ COLUNA 1 — BACKLOG ============ -->
  <g id="col-backlog">
    <rect x="30" y="310" width="170" height="130" rx="6" ry="6"
          fill="#E0E0E0" stroke="#616161" stroke-width="2"/>
    <text x="115" y="345" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">Backlog</text>
    <line x1="50" y1="356" x2="180" y2="356" stroke="#9E9E9E" stroke-width="1"/>
    <text x="115" y="382" font-size="12" text-anchor="middle" fill="#424242">Cards não planejados</text>
    <text x="115" y="402" font-size="12" text-anchor="middle" fill="#424242">DoR pendente</text>
  </g>

  <!-- seta Backlog → G1 -->
  <line x1="202" y1="375" x2="224" y2="375" stroke="#333333" stroke-width="2.5" marker-end="url(#arrFlow)"/>

  <!-- ============ GATE 1 — DoR ============ -->
  <g id="gate-1">
    <polygon points="246,318 356,318 376,375 356,432 246,432 226,375"
             fill="#FFFFFF" stroke="#B60205" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="301" y="340" font-size="13" font-weight="bold" text-anchor="middle" fill="#B60205">GATE 1 — DoR</text>
    <text x="301" y="360" font-size="11" text-anchor="middle" fill="#424242">critérios: Escopo §2.6</text>
    <text x="301" y="376" font-size="11" text-anchor="middle" fill="#424242">título · aceite ·</text>
    <text x="301" y="392" font-size="11" text-anchor="middle" fill="#424242">rastreabilidade ·</text>
    <text x="301" y="408" font-size="11" text-anchor="middle" fill="#424242">≤ 8h · responsável</text>
  </g>

  <!-- seta G1 → Ready -->
  <line x1="378" y1="375" x2="400" y2="375" stroke="#333333" stroke-width="2.5" marker-end="url(#arrFlow)"/>

  <!-- ============ COLUNA 2 — READY (DoR) ============ -->
  <g id="col-ready">
    <rect x="402" y="310" width="170" height="130" rx="6" ry="6"
          fill="#5319E7" stroke="#2F0F8A" stroke-width="2"/>
    <text x="487" y="345" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Ready (DoR)</text>
    <line x1="422" y1="356" x2="552" y2="356" stroke="#7B5CD6" stroke-width="1"/>
    <text x="487" y="382" font-size="12" text-anchor="middle" fill="#FFFFFF">Cards refinados</text>
    <text x="487" y="402" font-size="12" text-anchor="middle" fill="#FFFFFF">aguardando capacidade</text>
  </g>

  <!-- seta Ready → G2 -->
  <line x1="574" y1="375" x2="596" y2="375" stroke="#333333" stroke-width="2.5" marker-end="url(#arrFlow)"/>

  <!-- ============ GATE 2 — PULL ============ -->
  <g id="gate-2">
    <polygon points="618,318 728,318 748,375 728,432 618,432 598,375"
             fill="#FFFFFF" stroke="#B60205" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="673" y="345" font-size="13" font-weight="bold" text-anchor="middle" fill="#B60205">GATE 2 — Pull</text>
    <text x="673" y="372" font-size="11" text-anchor="middle" fill="#424242">capacidade disponível</text>
    <text x="673" y="390" font-size="11" text-anchor="middle" fill="#424242">WIP limit respeitado</text>
  </g>

  <!-- seta G2 → In Progress -->
  <line x1="750" y1="375" x2="772" y2="375" stroke="#333333" stroke-width="2.5" marker-end="url(#arrFlow)"/>

  <!-- ============ COLUNA 3 — IN PROGRESS ============ -->
  <g id="col-inprogress">
    <rect x="774" y="310" width="170" height="130" rx="6" ry="6"
          fill="#1D76DB" stroke="#0B3D6E" stroke-width="2"/>
    <text x="859" y="342" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">In Progress</text>
    <line x1="794" y1="353" x2="924" y2="353" stroke="#5B9BE0" stroke-width="1"/>
    <text x="859" y="377" font-size="12" text-anchor="middle" fill="#FFFFFF">Execução ativa</text>
    <text x="859" y="396" font-size="12" text-anchor="middle" fill="#FFFFFF">tasklist obrigatória</text>
    <text x="859" y="414" font-size="12" text-anchor="middle" fill="#FFFFFF">se ≥ 6h (ADR-004)</text>
  </g>

  <!-- seta In Progress → G3 -->
  <line x1="946" y1="375" x2="968" y2="375" stroke="#333333" stroke-width="2.5" marker-end="url(#arrFlow)"/>

  <!-- ============ GATE 3 — TASKLIST ============ -->
  <g id="gate-3">
    <polygon points="990,318 1100,318 1120,375 1100,432 990,432 970,375"
             fill="#FFFFFF" stroke="#B60205" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="1045" y="340" font-size="13" font-weight="bold" text-anchor="middle" fill="#B60205">GATE 3 — Tasklist</text>
    <text x="1045" y="362" font-size="11" text-anchor="middle" fill="#424242">100% dos itens</text>
    <text x="1045" y="378" font-size="11" text-anchor="middle" fill="#424242">concluídos (ADR-004)</text>
    <text x="1045" y="396" font-size="11" text-anchor="middle" fill="#424242">revisor atribuído</text>
  </g>

  <!-- seta G3 → Code Review -->
  <line x1="1122" y1="375" x2="1144" y2="375" stroke="#333333" stroke-width="2.5" marker-end="url(#arrFlow)"/>

  <!-- ============ COLUNA 4 — CODE REVIEW ============ -->
  <g id="col-review">
    <rect x="1146" y="310" width="170" height="130" rx="6" ry="6"
          fill="#FBCA04" stroke="#8A6D00" stroke-width="2"/>
    <text x="1231" y="345" font-size="15" font-weight="bold" text-anchor="middle" fill="#212121">Code Review</text>
    <line x1="1166" y1="356" x2="1296" y2="356" stroke="#C79E00" stroke-width="1"/>
    <text x="1231" y="382" font-size="12" text-anchor="middle" fill="#424242">Revisão por pares</text>
    <text x="1231" y="402" font-size="12" text-anchor="middle" fill="#424242">obrigatória</text>
  </g>

  <!-- seta Code Review → G4 -->
  <line x1="1318" y1="375" x2="1340" y2="375" stroke="#333333" stroke-width="2.5" marker-end="url(#arrFlow)"/>

  <!-- ============ GATE 4 — DoD ============ -->
  <g id="gate-4">
    <polygon points="1362,318 1472,318 1492,375 1472,432 1362,432 1342,375"
             fill="#FFFFFF" stroke="#B60205" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="1417" y="338" font-size="13" font-weight="bold" text-anchor="middle" fill="#B60205">GATE 4 — DoD</text>
    <text x="1417" y="357" font-size="11" text-anchor="middle" fill="#424242">critérios: Escopo §2.6</text>
    <text x="1417" y="373" font-size="11" text-anchor="middle" fill="#424242">testes ≥ 80% · CI verde</text>
    <text x="1417" y="389" font-size="11" text-anchor="middle" fill="#424242">aprovação de par ·</text>
    <text x="1417" y="405" font-size="11" text-anchor="middle" fill="#424242">co-autoria SDD</text>
  </g>

  <!-- seta G4 → Done -->
  <line x1="1494" y1="375" x2="1516" y2="375" stroke="#333333" stroke-width="2.5" marker-end="url(#arrFlow)"/>

  <!-- ============ COLUNA 5 — DONE (DoD) ============ -->
  <g id="col-done">
    <rect x="1518" y="310" width="170" height="130" rx="6" ry="6"
          fill="#0E8A16" stroke="#075B0E" stroke-width="2"/>
    <text x="1603" y="345" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Done (DoD)</text>
    <line x1="1538" y1="356" x2="1668" y2="356" stroke="#3FA845" stroke-width="1"/>
    <text x="1603" y="382" font-size="12" text-anchor="middle" fill="#FFFFFF">Incremento entregue</text>
    <text x="1603" y="402" font-size="12" text-anchor="middle" fill="#FFFFFF">commit mergeado</text>
  </g>

  <!-- ============ LOOP DE RETRABALHO (Code Review → In Progress) ============ -->
  <path d="M 1231 440 L 1231 505 L 859 505 L 859 442"
        fill="none" stroke="#D73A4A" stroke-width="2" stroke-dasharray="6,4"
        marker-end="url(#arrReturn)"/>
  <rect x="935" y="488" width="220" height="34" rx="4" ry="4"
        fill="#FFFFFF" stroke="#D73A4A" stroke-width="1.2"/>
  <text x="1045" y="503" font-size="11" font-weight="bold" text-anchor="middle" fill="#D73A4A">
    alterações solicitadas
  </text>
  <text x="1045" y="517" font-size="11" text-anchor="middle" fill="#D73A4A">
    → retrabalho
  </text>

  <!-- ============ NOTA: MÉTRICAS DE FLUXO (abaixo de Done) ============ -->
  <g id="nota-metricas">
    <line x1="1603" y1="440" x2="1603" y2="578" stroke="#616161" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="1448" y="580" width="310" height="98" rx="6" ry="6"
          fill="#F5F5F5" stroke="#616161" stroke-width="1.5"/>
    <text x="1603" y="603" font-size="13" font-weight="bold" text-anchor="middle" fill="#212121">
      📊 MÉTRICAS DE FLUXO (ADR-003)
    </text>
    <text x="1603" y="624" font-size="11" text-anchor="middle" fill="#424242">
      Cycle Time = In Progress → Done
    </text>
    <text x="1603" y="642" font-size="11" text-anchor="middle" fill="#424242">
      Throughput = cards concluídos/semana
    </text>
    <text x="1603" y="662" font-size="11" text-anchor="middle" fill="#616161">
      unidade de medida = card pai (ADR-004)
    </text>
  </g>

  <!-- ============ RODAPÉ DE GOVERNANÇA ============ -->
  <text x="875" y="722" font-size="11" font-style="italic" fill="#616161" text-anchor="middle">
    Regra geral: gate não atendido → card permanece na coluna anterior. Gates (hexágonos tracejados) materializam DoR/DoD (Escopo §2.6) e a regra de tasklist da ADR-004.
  </text>
  <text x="875" y="742" font-size="11" font-style="italic" fill="#616161" text-anchor="middle">
    WIP limit: 3 cards/pessoa · máximo 9 no fluxo — prevenção de burnout (TAP §10, R3). Sprints time-boxed NÃO são utilizadas — fluxo contínuo (ADR-002).
  </text>
  <text x="875" y="772" font-size="11" font-style="italic" fill="#9E9E9E" text-anchor="middle">
    Conforme Plano de Integração §1.3.1–§1.3.2 · ADR-002 · ADR-003 · ADR-004
  </text>
</svg>