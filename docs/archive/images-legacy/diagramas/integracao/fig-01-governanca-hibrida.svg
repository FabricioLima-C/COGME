<?xml version="1.0" encoding="UTF-8"?>
<!--
  FIG-1 — Modelo de Governança Híbrida Trifásico
  Projeto COGME | Plano de Integração §1.2 | Blindagem acadêmica (hierarquia normativa)
  Fonte e entregável: este arquivo .svg (padrão aberto W3C, zero dependências).
  Camadas:
    (1) PMBOK 7ª — governança primária (por que / para quê)
    (2) PMBOK 6ª — dicionário complementar (obsolescência assumida)
    (3) Manifesto Ágil + Kanban — método de execução (como)
  Setas:
    - Descendentes sólidas: autoridade normativa (L1 → L2 → L3)
    - Retorno tracejada vermelha: lições aprendidas (L3 → L1, EAP N9.2)
  Paleta: oficial do repositório (§9.1 da base de conhecimento operacional).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"
     role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Figura 1 — Modelo de governança híbrida trifásico do projeto COGME</title>
  <desc id="d">Três camadas empilhadas de governança com setas descendentes de autoridade normativa e seta de retorno lateral representando o fluxo de lições aprendidas.</desc>

  <defs>
    <marker id="arrDown" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#333333"/></marker>
    <marker id="arrReturn" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#B60205"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#FFFFFF"/>

  <!-- Título geral -->
  <text x="500" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#212121">
    Modelo de Governança Híbrida Trifásico — COGME
  </text>

  <!-- ============ CAMADA 1 — GOVERNANÇA PRIMÁRIA ============ -->
  <g id="camada-1">
    <rect x="100" y="50" width="800" height="130" rx="6" ry="6"
          fill="#1D76DB" stroke="#0B3D6E" stroke-width="2"/>
    <text x="500" y="82" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
      CAMADA 1 — GOVERNANÇA PRIMÁRIA
    </text>
    <text x="500" y="106" font-size="14" text-anchor="middle" fill="#FFFFFF">
      PMBOK® 7ª Edição
    </text>
    <text x="500" y="128" font-size="14" text-anchor="middle" fill="#FFFFFF">
      12 Princípios + 8 Domínios de Desempenho
    </text>
    <text x="500" y="152" font-size="13" font-style="italic" text-anchor="middle" fill="#FFFFFF">
      Define por que e para quê — orienta decisões por valor
    </text>
  </g>

  <!-- ============ SETA DESCENDENTE 1 (Autoridade normativa) ============ -->
  <line x1="500" y1="180" x2="500" y2="220"
        stroke="#333333" stroke-width="3" marker-end="url(#arrDown)"/>
  <rect x="370" y="188" width="260" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="500" y="205" font-size="12" text-anchor="middle" fill="#333333">
    autoridade normativa descendente
  </text>

  <!-- ============ CAMADA 2 — DICIONÁRIO COMPLEMENTAR ============ -->
  <g id="camada-2">
    <!-- Borda tracejada para marcar obsolescência (robusto em P&B) -->
    <rect x="100" y="225" width="800" height="150" rx="6" ry="6"
          fill="#F5F5F5" stroke="#616161" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="500" y="257" font-size="16" font-weight="bold" text-anchor="middle" fill="#212121">
      CAMADA 2 — DICIONÁRIO COMPLEMENTAR
    </text>
    <text x="500" y="281" font-size="14" text-anchor="middle" fill="#212121">
      PMBOK® 6ª Edição (2017)
    </text>
    <text x="500" y="303" font-size="14" text-anchor="middle" fill="#212121">
      Processos 4.1–4.7 citados para rastreabilidade acadêmica
    </text>
    <!-- Aviso de obsolescência -->
    <rect x="240" y="315" width="520" height="44" rx="4" ry="4"
          fill="#FFFFFF" stroke="#B60205" stroke-width="1.5"/>
    <text x="260" y="335" font-size="13" font-weight="bold" fill="#B60205">
      ⚠ OBSOLESCÊNCIA ASSUMIDA
    </text>
    <text x="260" y="353" font-size="12" fill="#424242">
      EVM (SPI/CPI) declarado LEGADO — NÃO APLICÁVEL (ADR-003)
    </text>
  </g>

  <!-- ============ SETA DESCENDENTE 2 (Vocabulário estrutural) ============ -->
  <line x1="500" y1="375" x2="500" y2="415"
        stroke="#333333" stroke-width="3" marker-end="url(#arrDown)"/>
  <rect x="380" y="383" width="240" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="500" y="400" font-size="12" text-anchor="middle" fill="#333333">
    vocabulário estrutural
  </text>

  <!-- ============ CAMADA 3 — MÉTODO DE EXECUÇÃO ============ -->
  <g id="camada-3">
    <rect x="100" y="420" width="800" height="130" rx="6" ry="6"
          fill="#0E8A16" stroke="#075B0E" stroke-width="2"/>
    <text x="500" y="452" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
      CAMADA 3 — MÉTODO DE EXECUÇÃO
    </text>
    <text x="500" y="476" font-size="14" text-anchor="middle" fill="#FFFFFF">
      Manifesto Ágil (4 valores) + Kanban (fluxo contínuo)
    </text>
    <text x="500" y="498" font-size="14" text-anchor="middle" fill="#FFFFFF">
      GitHub Projects como Fonte Única de Verdade (SSOT)
    </text>
    <text x="500" y="522" font-size="13" font-style="italic" text-anchor="middle" fill="#FFFFFF">
      Define como o trabalho é executado diariamente
    </text>
  </g>

  <!-- ============ SETA DE RETORNO (Lições Aprendidas — EAP N9.2) ============ -->
  <!-- Trajeto: sai da Camada 3 à direita, sobe, entra na Camada 1 à direita -->
  <path d="M 900 485 L 960 485 L 960 115 L 900 115"
        fill="none" stroke="#B60205" stroke-width="2" stroke-dasharray="6,4"
        marker-end="url(#arrReturn)"/>
  <!-- Rótulo da seta de retorno -->
  <rect x="920" y="280" width="75" height="60" rx="4" ry="4"
        fill="#FFFFFF" stroke="#B60205" stroke-width="1.5"/>
  <text x="957" y="300" font-size="11" font-weight="bold" text-anchor="middle" fill="#B60205">
    Lições
  </text>
  <text x="957" y="315" font-size="11" font-weight="bold" text-anchor="middle" fill="#B60205">
    Aprendidas
  </text>
  <text x="957" y="330" font-size="10" text-anchor="middle" fill="#424242">
    (EAP N9.2)
  </text>

  <!-- ============ RODAPÉ DE HIERARQUIA ============ -->
  <text x="500" y="585" font-size="11" font-style="italic" fill="#616161" text-anchor="middle">
    Hierarquia de resolução de conflitos: Valor entregue &gt; Ementa/Prof. Dr. Nivaldo Carleto &gt; PMBOK 7ª &gt; Ágil/Kanban &gt; PMBOK 6ª
  </text>
  <text x="500" y="605" font-size="11" font-style="italic" fill="#616161" text-anchor="middle">
    Conforme Plano de Integração §1.2.1 e OKB §3.1
  </text>
</svg>